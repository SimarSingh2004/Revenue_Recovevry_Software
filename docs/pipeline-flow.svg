<svg width="680" height="710" viewBox="0 0 680 710" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Revenue recovery pipeline flow</title>
<desc>A failed payment goes to Gemini for a decision, through policy evaluation with a bounded retry loop on rejection, to synthetic execution, into learning memory, then either resolves the case or loops back to Gemini after a failed attempt.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="710" fill="#FFFFFF"/>

<!-- Failed payment -->
<rect x="210" y="40" width="260" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Failed payment</text>

<line x1="340" y1="84" x2="340" y2="144" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Gemini decision -->
<rect x="210" y="144" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="166" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">Gemini decision</text>
<text x="340" y="184" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">Action, probability, rationale</text>

<line x1="340" y1="200" x2="340" y2="260" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Policy evaluation -->
<rect x="210" y="260" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="282" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#0C447C">Policy evaluation</text>
<text x="340" y="300" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#185FA5">6 checks &#183; up to 2 retries on reject</text>

<text x="350" y="346" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2C2C2A">approved</text>
<line x1="340" y1="316" x2="340" y2="376" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<path d="M210,288 L120,288 L120,172 L210,172" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="44" y="280" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2C2C2A">Rejected</text>

<!-- Synthetic execution -->
<rect x="210" y="376" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="398" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Synthetic execution</text>
<text x="340" y="416" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">SUCCESS or FAILED</text>

<line x1="340" y1="432" x2="340" y2="492" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Learning memory -->
<rect x="210" y="492" width="260" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="514" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#712B13">Learning memory</text>
<text x="340" y="532" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#993C1D">Every attempt recorded</text>

<line x1="340" y1="548" x2="340" y2="608" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<path d="M470,520 L530,520 L530,172 L470,172" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="540" y="512" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2C2C2A">Failed</text>

<!-- Case resolved -->
<rect x="210" y="608" width="260" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="340" y="630" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#27500A">Case resolved</text>
<text x="340" y="648" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B6D11">RECOVERED &#183; STOPPED &#183; ESCALATED</text>
</svg>
